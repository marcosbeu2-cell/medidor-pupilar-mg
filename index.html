<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Óticas M&G - Precision DP 6.0 Full</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bibliotecas MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0f172a; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 12px; }

        .container {
            width: 100%; max-width: 520px; background: #1e293b; border-radius: 20px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; border: 1px solid #334155; margin-top: 5px;
        }

        h1 { font-size: 19px; color: #fbbf24; margin-bottom: 2px; }
        p.subtitle { font-size: 11px; color: #94a3b8; margin-bottom: 12px; }

        /* Abas */
        .tabs { display: flex; background: #0f172a; padding: 4px; border-radius: 12px; gap: 4px; margin-bottom: 12px; border: 1px solid #334155; }
        .tab-btn { flex: 1; padding: 10px 6px; border: none; background: transparent; color: #94a3b8; font-size: 11px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .tab-btn.active { background: #38bdf8; color: #0f172a; }

        .controls-top { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-group { text-align: left; flex: 1; }
        .input-group label { font-size: 10px; text-transform: uppercase; color: #94a3b8; font-weight: 700; margin-bottom: 4px; display: block; }
        .form-control { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; font-size: 13px; }

        .btn-cam-switch { background: #334155; color: #fbbf24; border: 1px solid #475569; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; align-self: flex-end; display: flex; align-items: center; gap: 6px; }

        .camera-wrapper { position: relative; width: 100%; height: 340px; background: #000; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px solid #334155; touch-action: none; }

        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; width: 100%; height: 100%; object-fit: cover; }

        .guide-text { position: absolute; bottom: 10px; background: rgba(15, 23, 42, 0.9); color: #fff; font-size: 11px; font-weight: 600; padding: 6px 14px; border-radius: 20px; border: 1px solid #334155; pointer-events: none; z-index: 10; }

        .btn-start-measure { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 13px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .results-box { margin-top: 12px; background: #0f172a; border-radius: 12px; padding: 12px; border: 1px solid #334155; }
        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }

        .metric-card { background: #1e293b; padding: 8px; border-radius: 8px; border: 1px solid #334155; }
        .metric-card .title { font-size: 9px; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
        .metric-card .value { font-size: 18px; color: #38bdf8; font-weight: 800; margin-top: 2px; }
        .metric-card.highlight .value { color: #fbbf24; }

        .btn-group { display: flex; gap: 8px; margin-top: 12px; }
        .btn-action { flex: 1; background: linear-gradient(135deg, #25d366, #128c7e); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-secondary { background: #334155; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }

        /* Arquivo de Fotos e Clientes */
        .archive-section { margin-top: 16px; text-align: left; background: #0f172a; border-radius: 12px; padding: 12px; border: 1px solid #334155; }
        .archive-header { font-size: 11px; font-weight: 700; color: #fbbf24; text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .archive-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .archive-thumb { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; border: 1px solid #38bdf8; background: #000; cursor: pointer; }
        .archive-info { font-size: 11px; flex: 1; }
        .archive-info strong { color: #fff; font-size: 12px; display: block; }
        .archive-info span { color: #94a3b8; font-size: 10px; }
        .archive-actions { display: flex; gap: 4px; }
        .btn-icon { background: #334155; color: #38bdf8; border: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; }

        /* Modal para foto grande */
        .modal { display: none; position: fixed; z-index: 99; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .modal-img { max-width: 90%; max-height: 80%; border-radius: 12px; border: 2px solid #fbbf24; }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-crosshairs"></i> Precision DP 6.0</h1>
    <p class="subtitle">Óticas M&G - Pupilômetro Digital & Marcação de Armação</p>

    <div class="tabs">
        <button class="tab-btn active" id="tab1" onclick="mudarAba(1)"><i class="fa-solid fa-bolt"></i> 1. Direta (Sem Óculos)</button>
        <button class="tab-btn" id="tab2" onclick="mudarAba(2)"><i class="fa-solid fa-glasses"></i> 2. Com Óculos (Canetão Auto)</button>
    </div>

    <div class="controls-top">
        <div class="input-group">
            <label>Nome do Cliente</label>
            <input type="text" id="cliente_nome" class="form-control" placeholder="Ex: Cliente M&G">
        </div>
        <button class="btn-cam-switch" onclick="alternarCamera()"><i class="fa-solid fa-camera-rotate"></i> Câmera</button>
    </div>

    <div class="camera-wrapper" id="cam-wrapper">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="guide-text" id="status-text">📸 Centralize o rosto e tire a foto</div>
    </div>

    <button class="btn-start-measure" id="btn-iniciar" onclick="capturarETaggear()"><i class="fa-solid fa-camera"></i> TIRAR FOTO E MEDIR</button>

    <div class="results-box">
        <div style="font-size: 10px; font-weight: bold; color: #fbbf24; text-transform: uppercase;">Resultados do Cliente:</div>
        <div class="results-grid">
            <div class="metric-card">
                <div class="title">DNP Olho Direito (OD)</div>
                <div class="value" id="val-dnp-od">0.0 mm</div>
            </div>
            <div class="metric-card">
                <div class="title">DNP Olho Esquerdo (OE)</div>
                <div class="value" id="val-dnp-oe">0.0 mm</div>
            </div>
            <div class="metric-card highlight">
                <div class="title">DP Total</div>
                <div class="value" id="val-dp-total">0.0 mm</div>
            </div>
            <div class="metric-card">
                <div class="title">Altura Focal (CO)</div>
                <div class="value" id="val-co">0.0 mm</div>
            </div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-secondary" onclick="reiniciarCaptura()"><i class="fa-solid fa-rotate-right"></i> Tirar Outra Foto</button>
        <button class="btn-action" onclick="enviarWhatsApp()"><i class="fa-brands fa-whatsapp"></i> Enviar WhatsApp</button>
    </div>

    <div class="archive-section">
        <div class="archive-header">
            <span><i class="fa-solid fa-folder-open"></i> Arquivo de Clientes & Fotos</span>
            <span onclick="limparHistorico()" style="color:#ef4444; cursor:pointer; font-size:10px;">Limpar</span>
        </div>
        <div id="historico-lista"></div>
    </div>
</div>

<!-- Modal para ver foto ampliada -->
<div class="modal" id="modal-foto" onclick="fecharModal()">
    <img id="img-modal" class="modal-img">
</div>

<script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status-text');
    const btnIniciar = document.getElementById('btn-iniciar');

    const TAMANHO_IRIS_MM = 11.7;
    let abaAtual = 1;
    let modoCamera = "user"; 
    let fotoTirada = false;
    let cameraStream = null;
    let ultimaMedidaCalculada = null;

    let pontos = {
        pOD: { x: 0, y: 0 },
        pOE: { x: 0, y: 0 },
        pNariz: { x: 0, y: 0 },
        baseAroY: 0
    };
    let pontoArrastando = null;
    let mmPorPixel = 0.1;
    let imagemCongelada = null;

    const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5
    });

    faceMesh.onResults(onResultsMediaPipe);

    function mudarAba(numeroAba) {
        abaAtual = numeroAba;
        document.getElementById('tab1').classList.toggle('active', abaAtual === 1);
        document.getElementById('tab2').classList.toggle('active', abaAtual === 2);
        reiniciarCaptura();
    }

    async function iniciarCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
        }
        const constraints = {
            video: { facingMode: modoCamera, width: { ideal: 1280 }, height: { ideal: 720 } }
        };
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = cameraStream;
        } catch (e) {
            alert("Erro ao acessar a câmera: " + e.message);
        }
    }

    function capturarETaggear() {
        if (fotoTirada) return;

        canvasElement.width = videoElement.videoWidth || 640;
        canvasElement.height = videoElement.videoHeight || 480;

        canvasCtx.save();
        if (modoCamera === "user") {
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);
        }
        canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.restore();

        videoElement.style.display = 'none';
        canvasElement.style.display = 'block';

        imagemCongelada = new Image();
        imagemCongelada.src = canvasElement.toDataURL("image/jpeg");

        statusText.innerText = "🤖 Analisando imagem com IA...";
        statusText.style.background = "rgba(217, 119, 6, 0.9)";

        imagemCongelada.onload = () => {
            faceMesh.send({ image: imagemCongelada });
        };
    }

    function onResultsMediaPipe(results) {
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            const landmarks = results.multiFaceLandmarks[0];

            pontos.pOD = { x: landmarks[468].x * canvasElement.width, y: landmarks[468].y * canvasElement.height };
            pontos.pOE = { x: landmarks[473].x * canvasElement.width, y: landmarks[473].y * canvasElement.height };
            pontos.pNariz = { x: landmarks[6].x * canvasElement.width, y: landmarks[6].y * canvasElement.height };

            const irisE = landmarks[469];
            const irisD = landmarks[471];
            const larguraIrisPx = Math.hypot(
                (irisD.x - irisE.x) * canvasElement.width,
                (irisD.y - irisE.y) * canvasElement.height
            );

            mmPorPixel = TAMANHO_IRIS_MM / larguraIrisPx;
            pontos.baseAroY = pontos.pOD.y + (32 / mmPorPixel); 

            fotoTirada = true;
            recalcularEDesenhar();

            statusText.innerText = (abaAtual === 1) ? "✅ DNP / DP Calculadas com Sucesso!" : "🎯 Miras Aplicadas! Arraste com o dedo se precisar ajustar";
            statusText.style.background = "rgba(16, 185, 129, 0.95)";
            btnIniciar.style.display = 'none';

        } else {
            statusText.innerText = "⚠️ Rosto não identificado. Tente outra foto!";
            statusText.style.background = "rgba(239, 68, 68, 0.9)";
        }
    }

    function recalcularEDesenhar() {
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(imagemCongelada, 0, 0, canvasElement.width, canvasElement.height);

        let xOD = pontos.pOD.x;
        let xOE = pontos.pOE.x;
        let xNariz = pontos.pNariz.x;

        if (xOD > xOE) {
            let temp = xOD; xOD = xOE; xOE = temp;
        }

        const dnpOD = (Math.abs(xOD - xNariz) * mmPorPixel).toFixed(1);
        const dnpOE = (Math.abs(xOE - xNariz) * mmPorPixel).toFixed(1);
        const dpTotal = (Math.abs(xOE - xOD) * mmPorPixel).toFixed(1);
        const co = (Math.abs(pontos.baseAroY - pontos.pOD.y) * mmPorPixel).toFixed(1);

        document.getElementById('val-dnp-od').innerText = dnpOD + " mm";
        document.getElementById('val-dnp-oe').innerText = dnpOE + " mm";
        document.getElementById('val-dp-total').innerText = dpTotal + " mm";
        document.getElementById('val-co').innerText = (abaAtual === 2) ? (co + " mm") : "--";

        // DESENHAR MIRAS
        if (abaAtual === 1) {
            // Aba 1: Ponto discreto no centro pupilar
            desenharPontoDiscreto(pontos.pOD.x, pontos.pOD.y, "#38bdf8");
            desenharPontoDiscreto(pontos.pOE.x, pontos.pOE.y, "#38bdf8");
            desenharPontoDiscreto(pontos.pNariz.x, pontos.pNariz.y, "#fbbf24");
        } else {
            // Aba 2: Marcação estilo Canetão / Laboratório com linha do aro
            desenharCruzMira(pontos.pOD.x, pontos.pOD.y, "#fbbf24", "OD");
            desenharCruzMira(pontos.pOE.x, pontos.pOE.y, "#fbbf24", "OE");
            desenharCruzMira(pontos.pNariz.x, pontos.pNariz.y, "#38bdf8", "Nariz");

            canvasCtx.beginPath();
            canvasCtx.moveTo(pontos.pOD.x - 50, pontos.baseAroY);
            canvasCtx.lineTo(pontos.pOE.x + 50, pontos.baseAroY);
            canvasCtx.strokeStyle = "#ef4444";
            canvasCtx.lineWidth = 3;
            canvasCtx.stroke();

            canvasCtx.fillStyle = "#ef4444";
            canvasCtx.font = "bold 12px Inter";
            canvasCtx.fillText("Base do Aro", pontos.pOD.x - 50, pontos.baseAroY + 16);
        }

        // SALVAR NO HISTÓRICO AUTOMATICAMENTE
        salvarRegistroAtual(dnpOD, dnpOE, dpTotal, (abaAtual === 2 ? co : "N/A"));
    }

    function desenharPontoDiscreto(x, y, cor) {
        canvasCtx.beginPath();
        canvasCtx.arc(x, y, 6, 0, 2 * Math.PI);
        canvasCtx.fillStyle = cor;
        canvasCtx.fill();
        canvasCtx.strokeStyle = "#ffffff";
        canvasCtx.lineWidth = 2;
        canvasCtx.stroke();
    }

    function desenharCruzMira(x, y, cor, texto) {
        canvasCtx.beginPath();
        canvasCtx.arc(x, y, 14, 0, 2 * Math.PI);
        canvasCtx.strokeStyle = cor;
        canvasCtx.lineWidth = 2.5;
        canvasCtx.stroke();

        canvasCtx.beginPath();
        canvasCtx.moveTo(x - 22, y); canvasCtx.lineTo(x + 22, y);
        canvasCtx.moveTo(x, y - 22); canvasCtx.lineTo(x, y + 22);
        canvasCtx.strokeStyle = cor;
        canvasCtx.lineWidth = 2;
        canvasCtx.stroke();

        canvasCtx.fillStyle = cor;
        canvasCtx.font = "bold 11px Inter";
        canvasCtx.fillText(texto, x + 16, y - 6);
    }

    // ARRASTAR PONTOS NO TOUCH
    canvasElement.addEventListener('pointerdown', (e) => {
        if (!fotoTirada) return;
        const rect = canvasElement.getBoundingClientRect();
        const scaleX = canvasElement.width / rect.width;
        const scaleY = canvasElement.height / rect.height;

        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        if (Math.hypot(mouseX - pontos.pOD.x, mouseY - pontos.pOD.y) < 35) pontoArrastando = "pOD";
        else if (Math.hypot(mouseX - pontos.pOE.x, mouseY - pontos.pOE.y) < 35) pontoArrastando = "pOE";
        else if (Math.hypot(mouseX - pontos.pNariz.x, mouseY - pontos.pNariz.y) < 35) pontoArrastando = "pNariz";
        else if (abaAtual === 2 && Math.abs(mouseY - pontos.baseAroY) < 30) pontoArrastando = "baseAroY";
    });

    canvasElement.addEventListener('pointermove', (e) => {
        if (!pontoArrastando || !fotoTirada) return;
        const rect = canvasElement.getBoundingClientRect();
        const scaleX = canvasElement.width / rect.width;
        const scaleY = canvasElement.height / rect.height;

        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        if (pontoArrastando === "baseAroY") {
            pontos.baseAroY = mouseY;
        } else {
            pontos[pontoArrastando].x = mouseX;
            pontos[pontoArrastando].y = mouseY;
        }

        recalcularEDesenhar();
    });

    canvasElement.addEventListener('pointerup', () => { pontoArrastando = null; });

    // SISTEMA DE ARQUIVOS E SALVAMENTO
    function salvarRegistroAtual(dnpOD, dnpOE, dpTotal, co) {
        let nome = document.getElementById('cliente_nome').value.trim() || "Cliente M&G";
        let dataHora = new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
        let modoTexto = (abaAtual === 1) ? "Direta" : "Com Óculos";
        let fotoBase64 = canvasElement.toDataURL("image/jpeg", 0.85);

        ultimaMedidaCalculada = { nome, dnpOD, dnpOE, dpTotal, co, data: `${dataHora} (${modoTexto})`, foto: fotoBase64 };

        let historico = JSON.parse(localStorage.getItem('mg_pupila_arquivos') || '[]');
        historico.unshift(ultimaMedidaCalculada);
        if (historico.length > 20) historico.pop();
        localStorage.setItem('mg_pupila_arquivos', JSON.stringify(historico));

        renderizarHistorico();
    }

    function renderizarHistorico() {
        let historico = JSON.parse(localStorage.getItem('mg_pupila_arquivos') || '[]');
        const container = document.getElementById('historico-lista');
        container.innerHTML = "";

        if (historico.length === 0) {
            container.innerHTML = `<div style="font-size:11px; color:#94a3b8; padding:5px;">Nenhum cliente salvo.</div>`;
            return;
        }

        historico.forEach((h, index) => {
            const fotoHtml = h.foto ? `<img src="${h.foto}" class="archive-thumb" onclick="abrirModal('${h.foto}')" title="Ampliar Foto">` : '';
            container.innerHTML += `
                <div class="archive-card">
                    ${fotoHtml}
                    <div class="archive-info">
                        <strong>${h.nome}</strong>
                        <span>DP: ${h.dpTotal}mm (OD: ${h.dnpOD} | OE: ${h.dnpOE}) ${h.co !== 'N/A' ? '- CO: ' + h.co + 'mm' : ''}</span><br>
                        <span style="font-size:9px; color:#64748b;">${h.data}</span>
                    </div>
                    <div class="archive-actions">
                        <button class="btn-icon" onclick="downloadFicha(${index})" title="Baixar Ficha/Foto"><i class="fa-solid fa-download"></i></button>
                        <button class="btn-icon" style="color:#25d366;" onclick="reenviarWhatsIndex(${index})" title="Enviar WhatsApp"><i class="fa-brands fa-whatsapp"></i></button>
                    </div>
                </div>
            `;
        });
    }

    function abrirModal(fotoBase64) {
        document.getElementById('img-modal').src = fotoBase64;
        document.getElementById('modal-foto').style.display = 'flex';
    }

    function fecharModal() {
        document.getElementById('modal-foto').style.display = 'none';
    }

    function downloadFicha(index) {
        let historico = JSON.parse(localStorage.getItem('mg_pupila_arquivos') || '[]');
        let m = historico[index];
        if (!m || !m.foto) return;

        const a = document.createElement('a');
        a.href = m.foto;
        a.download = `Medicao_MG_${m.nome.replace(/\s+/g, '_')}.jpg`;
        a.click();
    }

    function reenviarWhatsIndex(index) {
        let historico = JSON.parse(localStorage.getItem('mg_pupila_arquivos') || '[]');
        let m = historico[index];
        if (!m) return;
        const texto = `📐 *Medidas Ópticas (Óticas M&G)*\n\n👤 *Cliente:* ${m.nome}\n👁️ *DNP Olho Direito:* ${m.dnpOD} mm\n👁️ *DNP Olho Esquerdo:* ${m.dnpOE} mm\n📏 *DP Total:* ${m.dpTotal} mm\n🎯 *Altura Focal (CO):* ${m.co} mm\n📅 *Registro:* ${m.data}`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
    }

    function limparHistorico() {
        if(confirm("Deseja apagar todo o histórico de registros?")) {
            localStorage.removeItem('mg_pupila_arquivos');
            renderizarHistorico();
        }
    }

    function reiniciarCaptura() {
        fotoTirada = false;
        videoElement.style.display = 'block';
        canvasElement.style.display = 'none';
        btnIniciar.style.display = 'flex';
        statusText.innerText = "📸 Centralize o rosto e tire a foto";
        statusText.style.background = "rgba(15, 23, 42, 0.9)";
        iniciarCamera();
    }

    function alternarCamera() {
        modoCamera = (modoCamera === "user") ? "environment" : "user";
        iniciarCamera();
    }

    function enviarWhatsApp() {
        if (!fotoTirada) { alert("Tire a foto e meça primeiro."); return; }
        reenviarWhatsIndex(0);
    }

    iniciarCamera();
    renderizarHistorico();
</script>
</body>
</html>
