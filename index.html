<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Óticas M&G - Precision DP 5.0 Foto First</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bibliotecas MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0f172a; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px; }

        .container {
            width: 100%; max-width: 520px; background: #1e293b; border-radius: 20px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; border: 1px solid #334155;
        }

        h1 { font-size: 19px; color: #fbbf24; margin-bottom: 2px; }
        p.subtitle { font-size: 11px; color: #94a3b8; margin-bottom: 12px; }

        .controls-top { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-group { text-align: left; flex: 1; }
        .input-group label { font-size: 10px; text-transform: uppercase; color: #94a3b8; font-weight: 700; margin-bottom: 4px; display: block; }
        .form-control { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; font-size: 13px; }

        .btn-cam-switch { background: #334155; color: #fbbf24; border: 1px solid #475569; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; align-self: flex-end; }

        .camera-wrapper { position: relative; width: 100%; height: 350px; background: #000; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px solid #334155; touch-action: none; }

        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; width: 100%; height: 100%; object-fit: cover; }

        .guide-text { position: absolute; bottom: 10px; background: rgba(15, 23, 42, 0.9); color: #fff; font-size: 11px; font-weight: 600; padding: 6px 14px; border-radius: 20px; border: 1px solid #334155; pointer-events: none; z-index: 10; }

        .btn-start-measure { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .results-box { margin-top: 12px; background: #0f172a; border-radius: 12px; padding: 12px; border: 1px solid #334155; }
        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }

        .metric-card { background: #1e293b; padding: 8px; border-radius: 8px; border: 1px solid #334155; }
        .metric-card .title { font-size: 9px; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
        .metric-card .value { font-size: 18px; color: #38bdf8; font-weight: 800; margin-top: 2px; }
        .metric-card.highlight .value { color: #fbbf24; }

        .btn-group { display: flex; gap: 8px; margin-top: 12px; }
        .btn-action { flex: 1; background: linear-gradient(135deg, #25d366, #128c7e); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-secondary { background: #334155; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-camera"></i> Precision DP 5.0</h1>
    <p class="subtitle">Óticas M&G - Captura de Foto + Mapeamento IA</p>

    <div class="controls-top">
        <div class="input-group">
            <label>Nome do Cliente</label>
            <input type="text" id="cliente_nome" class="form-control" placeholder="Ex: Cliente M&G">
        </div>
        <button class="btn-cam-switch" onclick="alternarCamera()"><i class="fa-solid fa-camera-rotate"></i> Câmera</button>
    </div>

    <div class="camera-wrapper" id="cam-wrapper">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="guide-text" id="status-text">📸 Centralize o rosto e tire a foto</div>
    </div>

    <button class="btn-start-measure" id="btn-iniciar" onclick="capturarETaggear()"><i class="fa-solid fa-camera"></i> TIRAR FOTO E MEDIR</button>

    <div class="results-box">
        <div style="font-size: 10px; font-weight: bold; color: #fbbf24; text-transform: uppercase;">Resultados do Cliente:</div>
        <div class="results-grid">
            <div class="metric-card">
                <div class="title">DNP Olho Direito (OD)</div>
                <div class="value" id="val-dnp-od">0.0 mm</div>
            </div>
            <div class="metric-card">
                <div class="title">DNP Olho Esquerdo (OE)</div>
                <div class="value" id="val-dnp-oe">0.0 mm</div>
            </div>
            <div class="metric-card highlight">
                <div class="title">DP Total</div>
                <div class="value" id="val-dp-total">0.0 mm</div>
            </div>
            <div class="metric-card">
                <div class="title">Altura Focal (CO)</div>
                <div class="value" id="val-co">0.0 mm</div>
            </div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-secondary" onclick="reiniciarCaptura()"><i class="fa-solid fa-rotate-right"></i> Tirar Outra Foto</button>
        <button class="btn-action" onclick="enviarWhatsApp()"><i class="fa-brands fa-whatsapp"></i> Enviar WhatsApp</button>
    </div>
</div>

<script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status-text');
    const btnIniciar = document.getElementById('btn-iniciar');

    const TAMANHO_IRIS_MM = 11.7;
    let modoCamera = "user"; 
    let fotoTirada = false;
    let cameraStream = null;

    let pontos = {
        pOD: { x: 0, y: 0 },
        pOE: { x: 0, y: 0 },
        pNariz: { x: 0, y: 0 },
        baseAroY: 0
    };
    let pontoArrastando = null;
    let mmPorPixel = 0.1;
    let imagemCongelada = null;

    const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5
    });

    faceMesh.onResults(onResultsMediaPipe);

    async function iniciarCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
        }
        const constraints = {
            video: { facingMode: modoCamera, width: { ideal: 1280 }, height: { ideal: 720 } }
        };
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = cameraStream;
        } catch (e) {
            alert("Erro ao acessar a câmera: " + e.message);
        }
    }

    function capturarETaggear() {
        if (fotoTirada) return;

        // Congela o frame do vídeo para o Canvas
        canvasElement.width = videoElement.videoWidth || 640;
        canvasElement.height = videoElement.videoHeight || 480;

        canvasCtx.save();
        if (modoCamera === "user") {
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);
        }
        canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.restore();

        // Troca vídeo por canvas
        videoElement.style.display = 'none';
        canvasElement.style.display = 'block';

        imagemCongelada = new Image();
        imagemCongelada.src = canvasElement.toDataURL("image/jpeg");

        statusText.innerText = "🤖 Processando foto com IA...";
        statusText.style.background = "rgba(217, 119, 6, 0.9)";

        // Envia a imagem estática para a IA processar
        imagemCongelada.onload = () => {
            faceMesh.send({ image: imagemCongelada });
        };
    }

    function onResultsMediaPipe(results) {
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            const landmarks = results.multiFaceLandmarks[0];

            // Mapeamento das coordenadas estáticas na foto
            pontos.pOD = { x: landmarks[468].x * canvasElement.width, y: landmarks[468].y * canvasElement.height };
            pontos.pOE = { x: landmarks[473].x * canvasElement.width, y: landmarks[473].y * canvasElement.height };
            pontos.pNariz = { x: landmarks[6].x * canvasElement.width, y: landmarks[6].y * canvasElement.height };

            const irisE = landmarks[469];
            const irisD = landmarks[471];
            const larguraIrisPx = Math.hypot(
                (irisD.x - irisE.x) * canvasElement.width,
                (irisD.y - irisE.y) * canvasElement.height
            );

            mmPorPixel = TAMANHO_IRIS_MM / larguraIrisPx;
            
            // Ponto estimado para a base da armação
            pontos.baseAroY = pontos.pOD.y + (32 / mmPorPixel); 

            fotoTirada = true;
            recalcularEDesenhar();

            statusText.innerText = "🎯 Miras aplicadas! Arraste com o dedo se precisar ajustar";
            statusText.style.background = "rgba(16, 185, 129, 0.95)";
            btnIniciar.style.display = 'none';

        } else {
            statusText.innerText = "⚠️ Rosto não identificado. Tente outra foto!";
            statusText.style.background = "rgba(239, 68, 68, 0.9)";
        }
    }

    function recalcularEDesenhar() {
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(imagemCongelada, 0, 0, canvasElement.width, canvasElement.height);

        // Ajuste de posições caso seja câmera frontal
        let xOD = pontos.pOD.x;
        let xOE = pontos.pOE.x;
        let xNariz = pontos.pNariz.x;

        // Garantir OD no lado Direito visual da lente do cliente
        if (xOD > xOE) {
            let temp = xOD; xOD = xOE; xOE = temp;
        }

        // Cálculos
        const dnpOD = (Math.abs(xOD - xNariz) * mmPorPixel).toFixed(1);
        const dnpOE = (Math.abs(xOE - xNariz) * mmPorPixel).toFixed(1);
        const dpTotal = (Math.abs(xOE - xOD) * mmPorPixel).toFixed(1);
        const co = (Math.abs(pontos.baseAroY - pontos.pOD.y) * mmPorPixel).toFixed(1);

        document.getElementById('val-dnp-od').innerText = dnpOD + " mm";
        document.getElementById('val-dnp-oe').innerText = dnpOE + " mm";
        document.getElementById('val-dp-total').innerText = dpTotal + " mm";
        document.getElementById('val-co').innerText = co + " mm";

        // Desenho das Miras
        desenharCruzMira(pontos.pOD.x, pontos.pOD.y, "#fbbf24", "OD");
        desenharCruzMira(pontos.pOE.x, pontos.pOE.y, "#fbbf24", "OE");
        desenharCruzMira(pontos.pNariz.x, pontos.pNariz.y, "#38bdf8", "Eixo Nariz");

        // Linha da Base
        canvasCtx.beginPath();
        canvasCtx.moveTo(pontos.pOD.x - 50, pontos.baseAroY);
        canvasCtx.lineTo(pontos.pOE.x + 50, pontos.baseAroY);
        canvasCtx.strokeStyle = "#ef4444";
        canvasCtx.lineWidth = 3;
        canvasCtx.stroke();

        canvasCtx.fillStyle = "#ef4444";
        canvasCtx.font = "bold 12px Inter";
        canvasCtx.fillText("Base da Armação", pontos.pOD.x - 50, pontos.baseAroY + 16);
    }

    function desenharCruzMira(x, y, cor, texto) {
        canvasCtx.beginPath();
        canvasCtx.arc(x, y, 14, 0, 2 * Math.PI);
        canvasCtx.strokeStyle = cor;
        canvasCtx.lineWidth = 2.5;
        canvasCtx.stroke();

        canvasCtx.beginPath();
        canvasCtx.moveTo(x - 22, y); canvasCtx.lineTo(x + 22, y);
        canvasCtx.moveTo(x, y - 22); canvasCtx.lineTo(x, y + 22);
        canvasCtx.strokeStyle = cor;
        canvasCtx.lineWidth = 2;
        canvasCtx.stroke();

        canvasCtx.fillStyle = cor;
        canvasCtx.font = "bold 11px Inter";
        canvasCtx.fillText(texto, x + 16, y - 6);
    }

    // ARRASTAR COM O DEDO NO TOUCH
    canvasElement.addEventListener('pointerdown', (e) => {
        if (!fotoTirada) return;
        const rect = canvasElement.getBoundingClientRect();
        const scaleX = canvasElement.width / rect.width;
        const scaleY = canvasElement.height / rect.height;

        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        if (Math.hypot(mouseX - pontos.pOD.x, mouseY - pontos.pOD.y) < 35) pontoArrastando = "pOD";
        else if (Math.hypot(mouseX - pontos.pOE.x, mouseY - pontos.pOE.y) < 35) pontoArrastando = "pOE";
        else if (Math.hypot(mouseX - pontos.pNariz.x, mouseY - pontos.pNariz.y) < 35) pontoArrastando = "pNariz";
        else if (Math.abs(mouseY - pontos.baseAroY) < 30) pontoArrastando = "baseAroY";
    });

    canvasElement.addEventListener('pointermove', (e) => {
        if (!pontoArrastando || !fotoTirada) return;
        const rect = canvasElement.getBoundingClientRect();
        const scaleX = canvasElement.width / rect.width;
        const scaleY = canvasElement.height / rect.height;

        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        if (pontoArrastando === "baseAroY") {
            pontos.baseAroY = mouseY;
        } else {
            pontos[pontoArrastando].x = mouseX;
            pontos[pontoArrastando].y = mouseY;
        }

        recalcularEDesenhar();
    });

    canvasElement.addEventListener('pointerup', () => { pontoArrastando = null; });

    function reiniciarCaptura() {
        fotoTirada = false;
        videoElement.style.display = 'block';
        canvasElement.style.display = 'none';
        btnIniciar.style.display = 'flex';
        statusText.innerText = "📸 Centralize o rosto e tire a foto";
        statusText.style.background = "rgba(15, 23, 42, 0.9)";
        iniciarCamera();
    }

    function alternarCamera() {
        modoCamera = (modoCamera === "user") ? "environment" : "user";
        iniciarCamera();
    }

    function enviarWhatsApp() {
        if (!fotoTirada) { alert("Tire a foto e meça primeiro."); return; }
        let nome = document.getElementById('cliente_nome').value.trim() || "Cliente M&G";
        let od = document.getElementById('val-dnp-od').innerText;
        let oe = document.getElementById('val-dnp-oe').innerText;
        let dp = document.getElementById('val-dp-total').innerText;
        let co = document.getElementById('val-co').innerText;

        const texto = `📐 *Medidas Ópticas (Óticas M&G)*\n\n👤 *Cliente:* ${nome}\n👁️ *DNP OD:* ${od}\n👁️ *DNP OE:* ${oe}\n📏 *DP Total:* ${dp}\n🎯 *Altura Focal (CO):* ${co}`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
    }

    iniciarCamera();
</script>
</body>
</html>
