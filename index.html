<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óticas M&G - Medidor Pupilar Precision 2.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bibliotecas MediaPipe da Google -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 15px; }

        .container {
            width: 100%;
            max-width: 520px;
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #334155;
            margin-top: 10px;
        }

        h1 { font-size: 20px; color: #fbbf24; margin-bottom: 4px; }
        p.subtitle { font-size: 12px; color: #94a3b8; margin-bottom: 15px; }

        .camera-wrapper {
            position: relative;
            width: 100%;
            height: 360px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #334155;
            transition: border-color 0.3s;
        }
        .camera-wrapper.aligned { border-color: #10b981; }

        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; }

        .face-overlay {
            position: absolute;
            width: 180px;
            height: 240px;
            border: 3px dashed rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.55);
            transition: border-color 0.3s;
        }
        .camera-wrapper.aligned .face-overlay { border-color: #10b981; }

        .guide-text {
            position: absolute;
            bottom: 12px;
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #334155;
            transition: all 0.3s;
        }

        .countdown-overlay {
            position: absolute;
            font-size: 80px;
            font-weight: 800;
            color: #fbbf24;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            display: none;
        }

        .input-group { margin-top: 15px; text-align: left; }
        .input-group label { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 700; margin-bottom: 5px; display: block; }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .results-box {
            margin-top: 15px;
            background: #0f172a;
            border-radius: 14px;
            padding: 15px;
            border: 1px solid #334155;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .metric-card {
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .metric-card .title { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
        .metric-card .value { font-size: 20px; color: #38bdf8; font-weight: 800; margin-top: 4px; }
        .metric-card.highlight .value { color: #fbbf24; }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; }

        .btn-action {
            flex: 1;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-secondary {
            background: #334155;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .history-section {
            margin-top: 20px;
            text-align: left;
            background: #0f172a;
            border-radius: 14px;
            padding: 15px;
            border: 1px solid #334155;
        }
        .history-title { font-size: 12px; font-weight: 700; color: #fbbf24; text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .history-item { font-size: 12px; padding: 8px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; color: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-crosshairs"></i> Precision DP 2.0</h1>
    <p class="subtitle">Alinhe seu rosto no círculo para leitura automática</p>

    <div class="input-group">
        <label>Nome do Cliente</label>
        <input type="text" id="cliente_nome" class="form-control" placeholder="Ex: João Souza">
    </div>

    <div class="camera-wrapper" id="cam-wrapper">
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="face-overlay"></div>
        <div class="countdown-overlay" id="countdown">3</div>
        <div class="guide-text" id="status-text">Iniciando câmera...</div>
    </div>

    <div class="results-box">
        <div style="font-size: 11px; font-weight: bold; color: #fbbf24; text-transform: uppercase;">Resultados da Leitura Estática:</div>
        
        <div class="results-grid">
            <div class="metric-card">
                <div class="title">DNP Olho Direito</div>
                <div class="value" id="val-dnp-od">0.0 mm</div>
            </div>
            <div class="metric-card">
                <div class="title">DNP Olho Esquerdo</div>
                <div class="value" id="val-dnp-oe">0.0 mm</div>
            </div>
            <div class="metric-card highlight">
                <div class="title">DP Total</div>
                <div class="value" id="val-dp-total">0.0 mm</div>
            </div>
            <div class="metric-card">
                <div class="title">Altura Focal (CO)</div>
                <div class="value" id="val-co">0.0 mm</div>
            </div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-secondary" onclick="reiniciarCaptura()"><i class="fa-solid fa-rotate-right"></i> Nova Foto</button>
        <button class="btn-action" onclick="enviarWhatsApp()"><i class="fa-brands fa-whatsapp"></i> Enviar WhatsApp</button>
    </div>

    <div class="history-section">
        <div class="history-title">
            <span><i class="fa-solid fa-clock-rotate-left"></i> Histórico Salvo</span>
            <span onclick="limparHistorico()" style="color:#ef4444; cursor:pointer; font-size:10px;">Limpar</span>
        </div>
        <div id="historico-lista"></div>
    </div>
</div>

<script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status-text');
    const camWrapper = document.getElementById('cam-wrapper');
    const countdownEl = document.getElementById('countdown');

    const TAMANHO_IRIS_MM = 11.7; // Padrão biológico horizontal da íris
    let capturaTravada = false;
    let emContagem = false;
    let tempoAlinhado = 0;
    let timerContagem = null;
    let ultimaMedidaCalculada = null;

    const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
    });

    faceMesh.onResults(onResults);

    function onResults(results) {
        if (capturaTravada) return; // Não atualiza se a foto já foi tirada

        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            const landmarks = results.multiFaceLandmarks[0];

            const pupilaDireita = landmarks[468];
            const pupilaEsquerda = landmarks[473];
            const ponteNariz = landmarks[6];

            const irisDireitaEsquerda = landmarks[469];
            const irisDireitaDireita = landmarks[471];

            // 1. Verifica Inclinação da Cabeça (Diferença no eito Y entre os olhos)
            const inclinacaoY = Math.abs((pupilaDireita.y - pupilaEsquerda.y) * canvasElement.height);
            
            // 2. Verifica Distância do Rosto pelo Tamanho da Íris em Pixels
            const larguraIrisPixels = Math.hypot(
                (irisDireitaDireita.x - irisDireitaEsquerda.x) * canvasElement.width,
                (irisDireitaDireita.y - irisDireitaEsquerda.y) * canvasElement.height
            );

            let estaAlinhado = true;

            if (inclinacaoY > 6) {
                statusText.innerText = "⚠️ Mantenha a cabeça reta (não incline)";
                statusText.style.background = "rgba(225, 29, 72, 0.9)";
                estaAlinhado = false;
            } else if (larguraIrisPixels < 12) {
                statusText.innerText = "🔍 Aproxime um pouco mais o rosto";
                statusText.style.background = "rgba(217, 119, 6, 0.9)";
                estaAlinhado = false;
            } else if (larguraIrisPixels > 35) {
                statusText.innerText = "↔️ Afaste um pouco o celular";
                statusText.style.background = "rgba(217, 119, 6, 0.9)";
                estaAlinhado = false;
            }

            if (estaAlinhado) {
                camWrapper.classList.add('aligned');
                statusText.innerText = "✅ Perfeito! Mantenha-se parado...";
                statusText.style.background = "rgba(16, 185, 129, 0.9)";

                // Inicia o processo de disparo automático
                if (!emContagem) {
                    iniciarContagem(landmarks);
                }
            } else {
                camWrapper.classList.remove('aligned');
                cancelarContagem();
            }

            // Desenha guias visuais
            desenharPonto(pupilaDireita, "#fbbf24");
            desenharPonto(pupilaEsquerda, "#fbbf24");
            desenharPonto(ponteNariz, "#38bdf8");

        } else {
            camWrapper.classList.remove('aligned');
            statusText.innerText = "Centralize seu rosto no círculo...";
            statusText.style.background = "rgba(15, 23, 42, 0.9)";
            cancelarContagem();
        }
        canvasCtx.restore();
    }

    function iniciarContagem(landmarks) {
        emContagem = true;
        let cont = 3;
        countdownEl.style.display = 'block';
        countdownEl.innerText = cont;

        timerContagem = setInterval(() => {
            cont--;
            if (cont > 0) {
                countdownEl.innerText = cont;
            } else {
                clearInterval(timerContagem);
                countdownEl.style.display = 'none';
                processarEGravarLeitura(landmarks);
            }
        }, 800);
    }

    function cancelarContagem() {
        emContagem = false;
        clearInterval(timerContagem);
        countdownEl.style.display = 'none';
    }

    function processarEGravarLeitura(landmarks) {
        capturaTravada = true;

        const pupilaDireita = landmarks[468];
        const pupilaEsquerda = landmarks[473];
        const ponteNariz = landmarks[6];

        const irisDireitaEsquerda = landmarks[469];
        const irisDireitaDireita = landmarks[471];

        const larguraIrisPixels = Math.hypot(
            (irisDireitaDireita.x - irisDireitaEsquerda.x) * canvasElement.width,
            (irisDireitaDireita.y - irisDireitaEsquerda.y) * canvasElement.height
        );

        const mmPorPixel = TAMANHO_IRIS_MM / larguraIrisPixels;

        const dnpODPixels = Math.abs((pupilaDireita.x - ponteNariz.x) * canvasElement.width);
        const dnpOEPixels = Math.abs((pupilaEsquerda.x - ponteNariz.x) * canvasElement.width);
        const dpTotalPixels = Math.abs((pupilaEsquerda.x - pupilaDireita.x) * canvasElement.width);
        const coPixels = Math.abs((pupilaDireita.y - (ponteNariz.y + 0.04)) * canvasElement.height);

        const dnpOD = (dnpODPixels * mmPorPixel).toFixed(1);
        const dnpOE = (dnpOEPixels * mmPorPixel).toFixed(1);
        const dpTotal = (dpTotalPixels * mmPorPixel).toFixed(1);
        const co = (coPixels * mmPorPixel).toFixed(1);

        document.getElementById('val-dnp-od').innerText = dnpOD + " mm";
        document.getElementById('val-dnp-oe').innerText = dnpOE + " mm";
        document.getElementById('val-dp-total').innerText = dpTotal + " mm";
        document.getElementById('val-co').innerText = co + " mm";

        statusText.innerText = "📸 FOTO CAPTURADA COM SUCESSO!";
        statusText.style.background = "rgba(16, 185, 129, 0.95)";

        let nome = document.getElementById('cliente_nome').value.trim() || "Cliente Sem Nome";
        ultimaMedidaCalculada = { nome, dnpOD, dnpOE, dpTotal, co, data: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) };

        salvarNoHistorico(ultimaMedidaCalculada);
    }

    function desenharPonto(landmark, cor) {
        canvasCtx.beginPath();
        canvasCtx.arc(landmark.x * canvasElement.width, landmark.y * canvasElement.height, 4, 0, 2 * Math.PI);
        canvasCtx.fillStyle = cor;
        canvasCtx.fill();
    }

    function reiniciarCaptura() {
        capturaTravada = false;
        emContagem = false;
        statusText.innerText = "Centralize seu rosto no círculo...";
        camWrapper.classList.remove('aligned');
    }

    function salvarNoHistorico(medida) {
        let historico = JSON.parse(localStorage.getItem('mg_pupila_historico') || '[]');
        historico.unshift(medida);
        localStorage.setItem('mg_pupila_historico', JSON.stringify(historico));
        renderizarHistorico();
    }

    function renderizarHistorico() {
        let historico = JSON.parse(localStorage.getItem('mg_pupila_historico') || '[]');
        const container = document.getElementById('historico-lista');
        container.innerHTML = "";

        if (historico.length === 0) {
            container.innerHTML = `<div class="history-item"><span>Nenhuma medição gravada.</span></div>`;
            return;
        }

        historico.slice(0, 5).forEach(h => {
            container.innerHTML += `
                <div class="history-item">
                    <span><strong>${h.nome}</strong> (${h.data})</span>
                    <span style="color:#fbbf24; font-weight:700;">DP: ${h.dpTotal}mm | OD: ${h.dnpOD} | OE: ${h.dnpOE}</span>
                </div>
            `;
        });
    }

    function limparHistorico() {
        localStorage.removeItem('mg_pupila_historico');
        renderizarHistorico();
    }

    function enviarWhatsApp() {
        if (!ultimaMedidaCalculada) {
            alert("Tire uma foto primeiro para gerar os dados do cliente.");
            return;
        }
        const m = ultimaMedidaCalculada;
        const texto = `📐 *Medidas Ópticas de Precision (Óticas M&G)*\n\n👤 *Cliente:* ${m.nome}\n👁️ *DNP Olho Direito:* ${m.dnpOD} mm\n👁️ *DNP Olho Esquerdo:* ${m.dnpOE} mm\n📏 *DP Total:* ${m.dpTotal} mm\n🎯 *Altura Focal (CO):* ${m.co} mm`;
        
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
    }

    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await faceMesh.send({ image: videoElement });
        },
        width: 640,
        height: 480
    });
    camera.start();

    renderizarHistorico();
</script>
</body>
</html>
