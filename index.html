<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óticas M&G - Medidor Pupilar Automático</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bibliotecas MediaPipe da Google para Detecção Facial em Tempo Real -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }

        .container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #334155;
        }

        h1 { font-size: 20px; color: #fbbf24; margin-bottom: 5px; }
        p.subtitle { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }

        .camera-wrapper {
            position: relative;
            width: 100%;
            height: 340px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #d97706;
        }

        /* Oculta o elemento video cru e mostra apenas o Canvas onde desenhamos os pontos */
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; }

        /* Moldura Oval de Enquadramento para o Cliente */
        .face-overlay {
            position: absolute;
            width: 180px;
            height: 240px;
            border: 3px dashed rgba(251, 191, 36, 0.7);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.45);
        }

        .guide-text {
            position: absolute;
            bottom: 12px;
            background: rgba(15, 23, 42, 0.85);
            color: #fff;
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .results-box {
            margin-top: 20px;
            background: #0f172a;
            border-radius: 14px;
            padding: 15px;
            border: 1px solid #334155;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .metric-card {
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .metric-card .title { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
        .metric-card .value { font-size: 20px; color: #38bdf8; font-weight: 800; margin-top: 4px; }
        .metric-card.highlight .value { color: #fbbf24; }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            margin-top: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-face-smile-beam"></i> Leitor de Medidas Ópticas</h1>
    <p class="subtitle">Olhe direto para a câmera e enquadre seu rosto no círculo</p>

    <div class="camera-wrapper">
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="face-overlay"></div>
        <div class="guide-text" id="status-text">Carregando Câmera e IA...</div>
    </div>

    <!-- PAINEL DE RESULTADOS EM TEMPO REAL -->
    <div class="results-box">
        <div style="font-size: 12px; font-weight: bold; color: #fbbf24; text-transform: uppercase;">Medidas Detectadas em Tempo Real:</div>
        
        <div class="results-grid">
            <div class="metric-card">
                <div class="title">DNP Olho Direito</div>
                <div class="value" id="val-dnp-od">0.0 mm</div>
            </div>
            <div class="metric-card">
                <div class="title">DNP Olho Esquerdo</div>
                <div class="value" id="val-dnp-oe">0.0 mm</div>
            </div>
            <div class="metric-card highlight">
                <div class="title">DP Total</div>
                <div class="value" id="val-dp-total">0.0 mm</div>
            </div>
            <div class="metric-card">
                <div class="title">Altura Focal (CO)</div>
                <div class="value" id="val-co">0.0 mm</div>
            </div>
        </div>
    </div>

    <button class="btn-action" onclick="copiarMedidas()">
        <i class="fa-solid fa-copy"></i> Copiar Medidas / Confirmar
    </button>
</div>

<script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status-text');

    // Média do diâmetro horizontal da íris humana (11.7 mm) para cálculo de escala
    const TAMANHO_IRIS_MM = 11.7;

    // Inicializa a biblioteca MediaPipe Face Mesh
    const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true, // Habilita rastreamento refinado de íris e pupilas
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    function onResults(results) {
        // Redimensiona o canvas para ajustar ao vídeo
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            statusText.innerText = "Rosto Detectado! Mantenha a cabeça reta.";
            statusText.style.background = "rgba(16, 185, 129, 0.85)";

            const landmarks = results.multiFaceLandmarks[0];

            // Pontos Chave do Rosto (Índices padrão do MediaPipe FaceMesh)
            const pupilaDireita = landmarks[468]; // Centro da íris direita
            const pupilaEsquerda = landmarks[473]; // Centro da íris esquerda
            const ponteNariz = landmarks[6];       // Centro entre os olhos no nariz
            const queixo = landmarks[152];         // Base do queixo para estimativa de CO

            // Pontos da borda da íris direita para converter Pixel -> Milímetro
            const irisDireitaEsquerda = landmarks[469];
            const irisDireitaDireita = landmarks[471];

            // 1. Calcula a largura da Íris em Pixels
            const larguraIrisPixels = Math.hypot(
                (irisDireitaDireita.x - irisDireitaEsquerda.x) * canvasElement.width,
                (irisDireitaDireita.y - irisDireitaEsquerda.y) * canvasElement.height
            );

            // 2. Descobre a proporção (Quantos mm existem por pixel nesta foto)
            const mmPorPixel = TAMANHO_IRIS_MM / larguraIrisPixels;

            // 3. Cálculo das Distâncias em Pixels
            const dnpODPixels = Math.abs((pupilaDireita.x - ponteNariz.x) * canvasElement.width);
            const dnpOEPixels = Math.abs((pupilaEsquerda.x - ponteNariz.x) * canvasElement.width);
            const dpTotalPixels = Math.abs((pupilaEsquerda.x - pupilaDireita.x) * canvasElement.width);
            const coPixels = Math.abs((pupilaDireita.y - (ponteNariz.y + 0.05)) * canvasElement.height);

            // 4. Conversão para Milímetros Reais
            const dnpOD = (dnpODPixels * mmPorPixel).toFixed(1);
            const dnpOE = (dnpOEPixels * mmPorPixel).toFixed(1);
            const dpTotal = (dpTotalPixels * mmPorPixel).toFixed(1);
            const co = (coPixels * mmPorPixel).toFixed(1);

            // Atualiza na tela
            document.getElementById('val-dnp-od').innerText = dnpOD + " mm";
            document.getElementById('val-dnp-oe').innerText = dnpOE + " mm";
            document.getElementById('val-dp-total').innerText = dpTotal + " mm";
            document.getElementById('val-co').innerText = co + " mm";

            // Desenha os pontos visuais das pupilas e nariz no canvas
            desenharPonto(pupilaDireita, "#fbbf24");
            desenharPonto(pupilaEsquerda, "#fbbf24");
            desenharPonto(ponteNariz, "#38bdf8");
        } else {
            statusText.innerText = "Centralize seu rosto na tela...";
            statusText.style.background = "rgba(15, 23, 42, 0.85)";
        }
        canvasCtx.restore();
    }

    function desenharPonto(landmark, cor) {
        canvasCtx.beginPath();
        canvasCtx.arc(landmark.x * canvasElement.width, landmark.y * canvasElement.height, 4, 0, 2 * Math.PI);
        canvasCtx.fillStyle = cor;
        canvasCtx.fill();
    }

    // Liga a Câmera do Celular / Computador
    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await faceMesh.send({ image: videoElement });
        },
        width: 640,
        height: 480
    });
    camera.start();

    function copiarMedidas() {
        const od = document.getElementById('val-dnp-od').innerText;
        const oe = document.getElementById('val-dnp-oe').innerText;
        const dp = document.getElementById('val-dp-total').innerText;
        const co = document.getElementById('val-co').innerText;

        const resumo = `📐 *Medidas do Cliente:*\nDNP OD: ${od}\nDNP OE: ${oe}\nDP Total: ${dp}\nAltura (CO): ${co}`;
        
        navigator.clipboard.writeText(resumo);
        alert("Medidas copiadas com sucesso! Você já pode colar no WhatsApp ou salvar no sistema.");
    }
</script>
</body>
</html>
